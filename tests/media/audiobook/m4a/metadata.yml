title: The Wall
authors: Roger Waters & David Gilmour
narrators: Roger Waters & David Gilmour & Gerald Scarfe
description: |-
  ‘A towering masterpiece of isolation and the breakdown of the human psyche.’

  Pink is a rock star forged in the fires of post-war trauma. From the shadow of a father lost at Anzio to the suffocating grip of an overprotective mother and a tyrannical school system, every trauma has been a brick.

  Now, barricaded behind a metaphorical wall of his own making, Pink spirals into a drug-fueled fever dream of fascist paranoia and animated nightmares. In the silence of a Los Angeles hotel room, the voices of his past—the Judge, the Schoolmaster, and the Wife—come to life to put his soul on trial.

  The verdict is looming: will he remain forever entombed in his own mind, or will he find the strength to tear down the wall? An immersive sonic journey through the architecture of madness.
lyrics: |-
  "All in all it was just another brick in the wall."
  "Hey you, out there in the cold, getting lonely, getting old..."
