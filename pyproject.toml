[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-cli"
version = "0.1.0"
description = "Ultimate Python CLI to handle audiobooks."
readme = "README.md"
authors = [{ name = "Ewilan Rivière" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pyyaml",
  "mutagen",
  "python-dotenv",
  "isodate",
  "httpx",
  "beautifulsoup4",
  "requests",
  "ffmpeg-python",
  "rich",
  "playwright",
  "playwright-stealth",
  "fake-useragent"
]

[project.scripts]
audiobook-tool = "audiobook.app:main"

[project.optional-dependencies]
dev = [
  "pytest~=8.0.0",
  "uv>=0.5.0"
]